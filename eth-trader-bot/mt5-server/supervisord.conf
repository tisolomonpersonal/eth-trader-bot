[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
loglevel=info

[program:xvfb]
command=Xvfb :99 -screen 0 1024x768x24 -nolisten tcp
autostart=true
autorestart=true
startsecs=3
priority=10
stdout_logfile=/var/log/xvfb.log
stderr_logfile=/var/log/xvfb.log

[program:mt5-bridge]
command=/app/entrypoint.sh
autostart=true
autorestart=true
startsecs=30
startretries=3
priority=20
stdout_logfile=/var/log/mt5-bridge.log
stderr_logfile=/var/log/mt5-bridge.log
stdout_logfile_maxbytes=5MB
stderr_logfile_maxbytes=5MB
