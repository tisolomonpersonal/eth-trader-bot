# zeabur.yaml — Multi-service deployment for the trading bot + Bybit TradFi (MT5)
# ─────────────────────────────────────────────────────────────────────────────
# Two services in one Zeabur project:
#   1. bot-app     — Flask dashboard + BNB crypto bot + TradFi bot
#   2. mt5-server  — MetaTrader5 terminal (Wine) + mt5linux RPC bridge
#
# TradFi (Forex/metals/indices/CFDs like EURUSD.s, XAUUSD.s) is NOT on Bybit's
# V5 crypto API — it lives on MT5. bot-app reaches it over Zeabur's private DNS:
#   MT5_HOST = mt5-server.zeabur.internal   MT5_PORT = 8001
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── 1. Flask trading bot (dashboard + BNB spot + TradFi) ────────────────────
  - name: bot-app
    domainPrefix: eth-bot           # public URL: eth-bot.zeabur.app
    buildType: DOCKER               # zbpack.json forces the root Dockerfile
    dockerfilePath: Dockerfile
    # Persist bot state + trade history across redeploys (DATA_DIR defaults /data)
    volumes:
      - mountPath: /data
        name: bot-data
    # Environment variables (set in Zeabur dashboard → bot-app → Variables):
    #   ── Crypto (BNB spot) ──
    #   BYBIT_API_KEY / BYBIT_API_SECRET   (omit → crypto runs in paper mode)
    #   ── TradFi master switch + instrument ──
    #   TRADFI_ENABLED = true
    #   TRADFI_SYMBOL  = EURUSD          (base symbol; ".s" is added in zero_fee mode)
    #   TRADFI_MODE    = zero_fee        (adds ".s" suffix) | tight_spread (no suffix)
    #   ── MT5 connection (points at the mt5-server service) ──
    #   MT5_HOST       = mt5-server.zeabur.internal
    #   MT5_PORT       = 8001
    #   MT5_LOGIN      = <your Bybit MT5 account number>
    #   MT5_PASSWORD   = <your Bybit MT5 password>
    #   MT5_SERVER     = <your Bybit MT5 server name>
    #   ── BTC hedged grid (read GRID.md before enabling) ──
    #   GRID_ENABLED    = true
    #   GRID_API_KEY    = <separate sub-account key — NOT the BB strategy's key.
    #                      The grid needs hedge mode, the BB strategy needs
    #                      one-way mode; they cannot share an account.>
    #   GRID_API_SECRET = <sub-account secret>
    #   GRID_QTY        = 0.001          (BTC per level; Bybit's minimum)
    #   GRID_LEVERAGE   = 28
    #   GRID_MAX_POSITION_BTC    = 0.008 (hard cap per side)
    #   GRID_MAX_DAILY_LOSS_USDT = 25    (realised-loss kill switch, UTC day)
    #   GRID_DRY_RUN    = true           (log orders without sending — start here)
    #   ── AI + alerts ──
    #   GROQ_API_KEY or OPENAI_API_KEY   (needed for BUY/SELL/HOLD signals)
    #   TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID

  # ── 2. MT5 RPC server (Wine + MetaTrader5 terminal) ─────────────────────────
  - name: mt5-server
    domainPrefix: ~                 # internal only — no public domain
    buildType: DOCKER
    dockerfilePath: mt5-server/Dockerfile
    # Persistent Wine prefix so the MT5 install survives redeploys (first cold
    # boot builds it in ~5–10 min; later restarts are fast).
    volumes:
      - mountPath: /root/.wine
        name: wine-prefix
    # Environment variables (set in Zeabur dashboard → mt5-server → Variables):
    #   MT5_PORT     = 8001
    #   MT5_LOGIN    = <your Bybit MT5 account number>   (for auto-login)
    #   MT5_PASSWORD = <your Bybit MT5 password>
    #   MT5_SERVER   = <your Bybit MT5 server name>
    #   VNC_PASSWORD = <optional>   (enables VNC on port 5900 to watch the terminal)
