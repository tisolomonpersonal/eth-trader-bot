# zeabur.yaml — Deployment for the BTC trading bot
# ─────────────────────────────────────────────────────────────────────────────
# One service: the Flask dashboard plus the BTC strategy threads.
#
#   1. BB short  — 4H Bollinger Band short on BTCUSDT perp. Always on.
#   2. Grid      — trend-following hedged grid. Off unless GRID_ENABLED=true.
#                  See GRID.md; it needs its own Bybit sub-account.
# ─────────────────────────────────────────────────────────────────────────────

services:
  - name: bot-app
    domainPrefix: eth-bot           # public URL: eth-bot.zeabur.app
    buildType: DOCKER               # zbpack.json forces the root Dockerfile
    dockerfilePath: Dockerfile
    # Persist bot state + trade history across redeploys (DATA_DIR defaults /data)
    volumes:
      - mountPath: /data
        name: bot-data
    # Environment variables (set in Zeabur dashboard → bot-app → Variables):
    #   ── Bybit ──
    #   BYBIT_API_KEY / BYBIT_API_SECRET   (omit → runs in paper mode)
    #   ── BB short strategy ──
    #   BTC_QTY  = 0.004                 (BTC per trade)
    #   LEVERAGE = 28
    #   MAX_DAILY_LOSS_USDT = 50
    #   MAX_TRADES_PER_DAY  = 5
    #   ── BTC hedged grid (read GRID.md before enabling) ──
    #   GRID_ENABLED    = true
    #   GRID_API_KEY    = <separate sub-account key — NOT the BB strategy's key.
    #                      The grid needs hedge mode, the BB strategy needs
    #                      one-way mode; they cannot share an account.>
    #   GRID_API_SECRET = <sub-account secret>
    #   GRID_QTY        = 0.001          (BTC per level; Bybit's minimum)
    #   GRID_LEVERAGE   = 28
    #   GRID_MAX_POSITION_BTC    = 0.008 (hard cap per side)
    #   GRID_MAX_DAILY_LOSS_USDT = 25    (realised-loss kill switch, UTC day)
    #   GRID_DRY_RUN    = true           (log orders without sending — start here)
    #   ── Alerts ──
    #   TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID
    #   TELEGRAM_PROFIT_ONLY     = true  (only profitable exits are sent)
    #   TELEGRAM_ALWAYS_CRITICAL = true  (crashes + kill switch still get through)
