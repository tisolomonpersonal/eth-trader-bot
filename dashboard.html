<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trading Console — eth-trader-bot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0C10; --panel:#12151B; --panel2:#171B23; --line:#242A34;
    --txt:#E6EAF0; --muted:#8A93A3; --dim:#5C6675;
    --crypto:#00D4AA; --tradfi:#F0B90B;
    --up:#16C784; --down:#EA3943; --hold:#8A93A3;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --ui:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:var(--ui);
    -webkit-font-smoothing:antialiased;padding:20px;min-height:100vh}
  a{color:inherit}
  .wrap{max-width:1180px;margin:0 auto}

  header{display:flex;align-items:center;justify-content:space-between;
    flex-wrap:wrap;gap:12px;padding-bottom:16px;border-bottom:1px solid var(--line);margin-bottom:20px}
  .brand{display:flex;align-items:baseline;gap:12px}
  .brand h1{font-size:18px;font-weight:700;letter-spacing:.3px}
  .brand .sub{font-family:var(--mono);font-size:11px;color:var(--dim)}
  .meta{display:flex;align-items:center;gap:16px;font-family:var(--mono);font-size:12px;color:var(--muted)}
  .badge{font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.5px;
    padding:3px 9px;border-radius:5px;border:1px solid transparent}
  .badge.paper{color:var(--tradfi);border-color:#3a3416;background:#1c1a0e}
  .badge.live{color:var(--up);border-color:#12402f;background:#0d211a}
  .refresh{display:flex;align-items:center;gap:7px}
  .hb{width:9px;height:9px;border-radius:50%;background:var(--dim)}
  .hb.beat{animation:beat .9s ease-out}
  @keyframes beat{0%{box-shadow:0 0 0 0 rgba(22,199,132,.55);background:var(--up)}
    100%{box-shadow:0 0 0 12px rgba(22,199,132,0);background:var(--up)}}

  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .phead{display:flex;align-items:center;justify-content:space-between;
    padding:14px 16px;border-bottom:1px solid var(--line);background:var(--panel2)}
  .phead .l{display:flex;align-items:center;gap:10px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--dim);position:relative}
  .dot.on{background:var(--up)} .dot.off{background:var(--down)} .dot.idle{background:var(--tradfi)}
  .dot.on::after{content:"";position:absolute;inset:-4px;border-radius:50%;
    border:1px solid var(--up);opacity:0;animation:ping 2s infinite}
  @keyframes ping{0%{transform:scale(.7);opacity:.7}100%{transform:scale(1.9);opacity:0}}
  .ptitle{font-size:13px;font-weight:700;letter-spacing:.4px}
  .ptag{font-family:var(--mono);font-size:10px;color:var(--dim);text-transform:uppercase}
  .sym{font-family:var(--mono);font-size:13px;font-weight:700}
  .c-crypto .sym{color:var(--crypto)} .c-tradfi .sym{color:var(--tradfi)}
  .c-crypto .accent{color:var(--crypto)} .c-tradfi .accent{color:var(--tradfi)}

  .pbody{padding:16px}
  .posrow{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  .pos{font-family:var(--mono);font-size:12px;font-weight:700;padding:4px 10px;border-radius:6px;
    border:1px solid var(--line)}
  .pos.inpos{color:var(--up);border-color:#12402f;background:#0d211a}
  .pos.flat{color:var(--muted);background:var(--panel2)}
  .side{font-family:var(--mono);font-size:11px;color:var(--dim)}

  .metrics{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:8px;overflow:hidden;margin-bottom:14px}
  .m{background:var(--panel);padding:11px 13px}
  .m .k{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:5px}
  .m .v{font-family:var(--mono);font-size:15px;font-weight:600}
  .v.up{color:var(--up)} .v.down{color:var(--down)} .v.mut{color:var(--muted)}

  .action{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:11px 13px;margin-bottom:12px}
  .action .top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
  .act{font-family:var(--mono);font-size:12px;font-weight:700;padding:3px 9px;border-radius:5px}
  .act.BUY{color:var(--up);background:#0d211a}
  .act.SELL{color:var(--down);background:#2a1315} .act.SL{color:var(--down);background:#2a1315}
  .act.TP{color:var(--up);background:#0d211a}
  .act.HOLD,.act.NONE{color:var(--hold);background:var(--panel)}
  .act.AISELL{color:var(--down);background:#2a1315}
  .conf{font-family:var(--mono);font-size:11px;color:var(--muted)}
  .reason{font-size:12px;color:var(--muted);line-height:1.5}

  .trades{margin-top:4px}
  .trades .th{font-size:10px;color:var(--dim);text-transform:uppercase;letter-spacing:.5px;
    padding:0 0 7px;border-bottom:1px solid var(--line);display:grid;
    grid-template-columns:70px 1fr 1fr 1fr;gap:8px}
  .trades .tr{font-family:var(--mono);font-size:12px;padding:8px 0;border-bottom:1px solid #1b2028;
    display:grid;grid-template-columns:70px 1fr 1fr 1fr;gap:8px;align-items:center}
  .trades .tr:last-child{border-bottom:none}
  .tside{font-weight:700;font-size:11px}
  .tside.BUY{color:var(--up)} .tside.SELL,.tside.SL,.tside.AISELL{color:var(--down)} .tside.TP{color:var(--up)}
  .tnum{color:var(--txt)} .tmut{color:var(--dim);font-size:11px}
  .empty{color:var(--dim);font-size:12px;font-family:var(--mono);padding:14px 0;text-align:center}
  .disabled{padding:34px 16px;text-align:center}
  .disabled .big{font-family:var(--mono);color:var(--tradfi);font-size:13px;font-weight:700;margin-bottom:8px}
  .disabled .txt{color:var(--muted);font-size:12px;line-height:1.6}
  code{font-family:var(--mono);background:var(--panel2);padding:1px 6px;border-radius:4px;color:var(--tradfi);font-size:11px}

  footer{margin-top:22px;text-align:center;font-family:var(--mono);font-size:11px;color:var(--dim)}
  .err{color:var(--down)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <h1>TRADING CONSOLE</h1>
      <span class="sub">eth-trader-bot · dual-market monitor</span>
    </div>
    <div class="meta">
      <span id="mode" class="badge paper">— — —</span>
      <span class="refresh">
        <span id="hb" class="hb"></span>
        <span id="updated">connecting…</span>
      </span>
    </div>
  </header>

  <div class="grid">
    <!-- CRYPTO -->
    <section class="panel c-crypto" id="crypto">
      <div class="phead">
        <div class="l"><span class="dot idle" id="c-dot"></span>
          <span class="ptitle">CRYPTO SPOT</span></div>
        <div style="text-align:right">
          <div class="sym" id="c-sym">BNBUSDT</div>
          <div class="ptag">bybit · 1m · 24/7</div>
        </div>
      </div>
      <div class="pbody" id="c-body">
        <div class="empty">loading…</div>
      </div>
    </section>

    <!-- TRADFI -->
    <section class="panel c-tradfi" id="tradfi">
      <div class="phead">
        <div class="l"><span class="dot idle" id="t-dot"></span>
          <span class="ptitle">TRADFI</span></div>
        <div style="text-align:right">
          <div class="sym" id="t-sym">XAUUSD</div>
          <div class="ptag">bybit linear · market hrs</div>
        </div>
      </div>
      <div class="pbody" id="t-body">
        <div class="empty">loading…</div>
      </div>
    </section>
  </div>

  <footer id="foot">auto-refresh every 10s · <span id="foot-status">—</span></footer>
</div>

<script>
const REFRESH_MS = 10000;

const $ = id => document.getElementById(id);
const nfmt = (v,d=2) => (v===null||v===undefined||isNaN(v)) ? "—"
  : Number(v).toLocaleString("en-US",{minimumFractionDigits:d,maximumFractionDigits:d});
const money = v => (v>=0?"+":"") + "$" + nfmt(Math.abs(v),2);
const cls = v => v>0?"up":v<0?"down":"mut";
const esc = s => String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const ago = iso => {
  if(!iso) return "—";
  const t=new Date(iso); if(isNaN(t)) return "—";
  const s=Math.floor((Date.now()-t)/1000);
  if(s<60) return s+"s ago"; if(s<3600) return Math.floor(s/60)+"m ago";
  if(s<86400) return Math.floor(s/3600)+"h ago"; return Math.floor(s/86400)+"d ago";
};

function actClass(a){ return String(a||"NONE").replace(/[^A-Za-z]/g,"").toUpperCase(); }

function renderPanel(prefix, data){
  const dot = $(prefix+"-dot");
  const s = data.state || {};
  const inPos = s.in_position;
  dot.className = "dot " + (inPos ? "on" : "idle");

  const sideLabel = s.side ? ` · ${esc(s.side).toUpperCase()}` : "";
  const posHtml = inPos
    ? `<span class="pos inpos">● IN POSITION</span><span class="side">entry ${nfmt(s.entry_price,4)}${sideLabel}</span>`
    : `<span class="pos flat">○ FLAT</span><span class="side">no open position</span>`;

  const dailyC = cls(s.daily_pnl_usdt), totalC = cls(s.total_pnl_usdt);
  const a = actClass(s.last_action);
  const conf = s.last_confidence ? `${s.last_confidence}/100` : "—";

  const metrics = inPos ? `
      <div class="m"><div class="k">Entry</div><div class="v">${nfmt(s.entry_price,4)}</div></div>
      <div class="m"><div class="k">Qty</div><div class="v">${nfmt(s.qty,4)}</div></div>
      <div class="m"><div class="k">Stop Loss</div><div class="v down">${nfmt(s.sl_price,4)}</div></div>
      <div class="m"><div class="k">Take Profit</div><div class="v up">${nfmt(s.tp_price,4)}</div></div>
  ` : `
      <div class="m"><div class="k">Trades Today</div><div class="v">${s.trade_count_today ?? 0}</div></div>
      <div class="m"><div class="k">Total Trades</div><div class="v">${s.total_trades ?? 0}</div></div>
      <div class="m"><div class="k">Daily P&L</div><div class="v ${dailyC}">${money(s.daily_pnl_usdt||0)}</div></div>
      <div class="m"><div class="k">Total P&L</div><div class="v ${totalC}">${money(s.total_pnl_usdt||0)}</div></div>
  `;

  const pnlBar = inPos ? `
    <div class="metrics">
      <div class="m"><div class="k">Daily P&L</div><div class="v ${dailyC}">${money(s.daily_pnl_usdt||0)}</div></div>
      <div class="m"><div class="k">Total P&L</div><div class="v ${totalC}">${money(s.total_pnl_usdt||0)}</div></div>
    </div>` : "";

  const trades = (data.recent_trades||[]).slice().reverse();
  const tradeRows = trades.length ? trades.map(t=>{
    const side = actClass(t.trigger || t.side);
    const hasPnl = (t.pnl!==undefined && t.pnl!==null);
    return `<div class="tr">
      <span class="tside ${side}">${esc(t.trigger||t.side||"—")}</span>
      <span class="tnum">${nfmt(t.price,4)}</span>
      <span class="tmut">${nfmt(t.qty,4)}</span>
      <span class="${hasPnl?('v '+cls(t.pnl)):'tmut'}">${hasPnl?money(t.pnl):(t.confidence?t.confidence+'/100':'—')}</span>
    </div>`;
  }).join("") : `<div class="empty">no trades yet</div>`;

  $(prefix+"-body").innerHTML = `
    <div class="posrow">${posHtml}</div>
    <div class="metrics">${metrics}</div>
    ${pnlBar}
    <div class="action">
      <div class="top">
        <span class="act ${a}">${esc(s.last_action||"NONE")}</span>
        <span class="conf">conf ${conf} · ${ago(s.entry_time)}</span>
      </div>
      <div class="reason">${esc(s.last_reason||"Awaiting first signal…")}</div>
    </div>
    <div class="trades">
      <div class="th"><span>Side</span><span>Price</span><span>Qty</span><span>P&L / Conf</span></div>
      ${tradeRows}
    </div>`;
}

function renderDisabled(prefix, msg){
  $(prefix+"-dot").className = "dot idle";
  $(prefix+"-body").innerHTML = `
    <div class="disabled">
      <div class="big">◐ TRADFI DISABLED</div>
      <div class="txt">${esc(msg||"This market is turned off.")}<br><br>
      Enable it by setting <code>TRADFI_ENABLED=true</code> in your environment and redeploying.</div>
    </div>`;
}

async function tick(){
  try{
    const [cr, tr] = await Promise.all([
      fetch("/status").then(r=>r.json()),
      fetch("/tradfi/status").then(r=>r.json())
    ]);

    const paper = cr.paper_mode;
    const badge = $("mode");
    badge.textContent = paper ? "PAPER MODE" : "● LIVE";
    badge.className = "badge " + (paper ? "paper" : "live");

    if(cr.status==="ok"){ if(cr.state && cr.symbol) $("c-sym").textContent = cr.symbol; renderPanel("c", cr); }
    if(tr.status==="disabled") renderDisabled("t", tr.message);
    else if(tr.status==="ok"){ if(tr.symbol) $("t-sym").textContent = tr.symbol; renderPanel("t", tr); }

    const hb = $("hb"); hb.classList.remove("beat"); void hb.offsetWidth; hb.classList.add("beat");
    $("updated").textContent = new Date().toLocaleTimeString("en-US",{hour12:false});
    $("updated").className = "";
    $("foot-status").textContent = "connected";
    $("foot-status").className = "";
  }catch(e){
    $("updated").textContent = "connection error";
    $("updated").className = "err";
    $("foot-status").textContent = "retrying…";
    $("foot-status").className = "err";
  }
}

tick();
setInterval(tick, REFRESH_MS);
</script>
</body>
</html>
